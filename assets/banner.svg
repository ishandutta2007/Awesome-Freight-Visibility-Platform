<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <style>
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); opacity: 0.7; }
      }
      @keyframes moveVehicle {
        0% { transform: translate(0, 0); }
        50% { transform: translate(350px, -40px); }
        100% { transform: translate(700px, 0); }
      }
      .route-line {
        stroke: #38bdf8;
        stroke-width: 3;
        stroke-dasharray: 8 6;
        animation: dash 2s linear infinite;
      }
      .ping {
        animation: pulse 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>

  <!-- Subtle Network Graph Lines (Background layer behind text) -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="4" fill="#38bdf8" />
    <circle cx="350" cy="50" r="5" fill="#818cf8" />
    <circle cx="950" cy="70" r="4" fill="#38bdf8" />
    <circle cx="1050" cy="180" r="6" fill="#c084fc" />
    <circle cx="850" cy="260" r="5" fill="#38bdf8" />

    <line x1="150" y1="80" x2="350" y2="50" stroke="#38bdf8" stroke-width="1"/>
    <line x1="950" y1="70" x2="1050" y2="180" stroke="#818cf8" stroke-width="1"/>
    <line x1="1050" y1="180" x2="850" y2="260" stroke="#c084fc" stroke-width="1"/>
  </g>

  <!-- Dynamic Transit Route at Bottom (Safely beneath text) -->
  <path class="route-line" d="M 100 250 Q 400 180, 600 250 T 1100 240" fill="none"/>
  
  <!-- Location Nodes with Pulse -->
  <g class="ping" transform="translate(100, 250)">
    <circle cx="0" cy="0" r="8" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <g class="ping" transform="translate(600, 250)">
    <circle cx="0" cy="0" r="8" fill="#818cf8"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#818cf8" stroke-width="2"/>
  </g>
  <g class="ping" transform="translate(1100, 240)">
    <circle cx="0" cy="0" r="8" fill="#c084fc"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#c084fc" stroke-width="2"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- Top Pill Badge -->
    <rect x="460" y="35" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="600" y="56" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
      🚚 REAL-TIME LOGISTICS ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="600" y="130" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Freight Visibility Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="175" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
      Curated Real-Time Transportation Visibility (RTTVP), Predictive ETA &amp; Supply Chain Control Towers
    </text>
  </g>
</svg>
